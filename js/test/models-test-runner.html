<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pruebas de modelos - FerroLab</title>
  <link rel="shortcut icon" type="image/png"
        href="https://cdnjs.cloudflare.com/ajax/libs/jasmine/5.10.0/jasmine_favicon.png">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/jasmine/5.10.0/jasmine.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jasmine/5.10.0/jasmine.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jasmine/5.10.0/jasmine-html.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jasmine/5.10.0/boot0.min.js"></script>
  <!-- boot1 se reemplaza por una inicialización manual: boot1 ejecuta la suite en window.onload,
       antes de que los specs (módulos ES) terminen de registrarse. -->
</head>
<body>
  <script type="module">
    const env = jasmine.getEnv();
    const htmlReporter = new jasmine.HtmlReporter({
      env,
      navigateWithNewParam: (key, value) => new jasmine.QueryString({ getWindowLocation: () => window.location }).navigateWithNewParam(key, value),
      addToExistingQueryString: (key, value) => new jasmine.QueryString({ getWindowLocation: () => window.location }).fullStringWithNewParam(key, value),
      getContainer: () => document.body,
      createElement: (...args) => document.createElement(...args),
      createTextNode: (...args) => document.createTextNode(...args),
      timer: new jasmine.Timer()
    });
    env.addReporter(globalThis.jsApiReporter);
    env.addReporter(htmlReporter);
    htmlReporter.initialize();

    await import("./models.spec.js");
    window.jasmineExecutionStarted = true;
    await env.execute();
    window.jasmineDone = true;
  </script>
</body>
</html>
